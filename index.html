<!doctype html>
<html lang="mn">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Тал нутгаас Самуй руу</title>
<meta name="description" content="Шинэ жилийн аялал: Улаанбаатар → Эрээн → Хөх хот → Шанхай → Ко Самуй → Бангкок. 2026.12.25 – 2027.01.03.">
<meta name="theme-color" content="#121518" media="(prefers-color-scheme: dark)">
<meta name="theme-color" content="#F4F5F7" media="(prefers-color-scheme: light)">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon.svg">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Onest:wght@400;500;600;700&display=swap">
<script src="https://cdnjs.cloudflare.com/ajax/libs/lz-string/1.5.0/lz-string.min.js" defer></script>
<script src="config.js"></script>
<style>
/* Calm travel planner. Neutral surfaces, one deep-teal accent for actions.
   Climate colours (slate blue → teal → burnt orange) mark days and places, quietly. */
:root{
  --bg:#F4F5F7; --surface:#FFFFFF; --surface-2:#F1F3F5; --ink:#16191D; --ink-2:#3E4650; --muted:#6B7380; --line:#E3E6EA;
  --acc:#0E6F78; --acc-ink:#FFFFFF; --acc-soft:#E3F1F2;
  --frost:#3D5A99; --frost-soft:#E8EDF7; --sea:#0E7C86; --sea-soft:#E1F1F2; --sun:#B85C1E; --sun-soft:#F8EBE1;
  --ok:#2E7D4F; --ok-soft:#E3F2E9; --bad:#C0392B; --bad-soft:#FBE7E4; --warn:#9A6A12; --warn-soft:#FBF2DE;
  --pink:var(--sun); --violet:var(--frost); --gold:var(--warn);
  --g-frost:var(--frost); --g-sea:var(--sea); --g-sun:var(--sun);
  --shadow:0 1px 2px rgba(16,24,40,.05);
  --r:12px;
  --f-display:"Onest",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --f-body:"Onest",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#121518; --surface:#1A1E22; --surface-2:#22272C; --ink:#ECEFF2; --ink-2:#C4CAD1; --muted:#8C95A0; --line:#2C3238;
  --acc:#4FB3BC; --acc-ink:#0B1A1C; --acc-soft:#173235;
  --frost:#8FA8DD; --frost-soft:#1E2738; --sea:#4FB3BC; --sea-soft:#173235; --sun:#E09A63; --sun-soft:#33241A;
  --ok:#6CC495; --ok-soft:#173225; --bad:#F08A7E; --bad-soft:#3A1E1B; --warn:#E2B55A; --warn-soft:#352B17;
  --shadow:0 1px 2px rgba(0,0,0,.3); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#121518; --surface:#1A1E22; --surface-2:#22272C; --ink:#ECEFF2; --ink-2:#C4CAD1; --muted:#8C95A0; --line:#2C3238;
  --acc:#4FB3BC; --acc-ink:#0B1A1C; --acc-soft:#173235;
  --frost:#8FA8DD; --frost-soft:#1E2738; --sea:#4FB3BC; --sea-soft:#173235; --sun:#E09A63; --sun-soft:#33241A;
  --ok:#6CC495; --ok-soft:#173225; --bad:#F08A7E; --bad-soft:#3A1E1B; --warn:#E2B55A; --warn-soft:#352B17;
  --shadow:0 1px 2px rgba(0,0,0,.3); color-scheme:dark}

*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%;-webkit-tap-highlight-color:transparent}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:14.5px;line-height:1.5;
  padding-bottom:calc(76px + env(safe-area-inset-bottom,0px));min-height:100dvh;overflow-x:hidden}
@media (min-width:900px){body{padding-bottom:40px}}
h1,h2,h3,h4{margin:0;text-wrap:balance;letter-spacing:-.01em}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--acc);outline-offset:2px;border-radius:6px}
.num{font-variant-numeric:tabular-nums}
.muted{color:var(--muted)}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
[hidden]{display:none!important}
.shell{max-width:1080px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.ic{width:16px;height:16px;flex:none}

/* top bar */
.top{position:sticky;top:0;z-index:30;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);
  padding-top:env(safe-area-inset-top,0px);border-bottom:1px solid transparent;transition:border-color .2s}
.top.scrolled{border-bottom-color:var(--line)}
.top .shell{display:flex;align-items:center;gap:8px;height:52px}
.brand{font-weight:700;font-size:15px;display:flex;align-items:center;gap:8px;white-space:nowrap;min-width:0}
.brand i{width:22px;height:22px;border-radius:6px;background:var(--acc);display:inline-grid;place-items:center;flex:none;color:var(--acc-ink)}
.brand i svg{width:14px;height:14px}
.tabs-top{display:none;gap:2px;margin-left:16px}
@media (min-width:900px){.tabs-top{display:flex}}
.tabs-top button{border:0;background:none;padding:7px 11px;border-radius:8px;font-weight:600;color:var(--muted);display:flex;gap:6px;align-items:center;position:relative}
.tabs-top button svg{width:16px;height:16px}
.tabs-top button[aria-current="page"]{color:var(--ink);background:var(--surface);box-shadow:var(--shadow)}
.tabs-top .badge{position:static;margin-left:2px}
.top .spacer{flex:1}
.me-btn{display:flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:3px 10px 3px 3px;font-weight:600;font-size:13px}
@media (max-width:560px){.me-btn span:not(.av){display:none}.me-btn{padding:3px}}
.sync{display:inline-flex;align-items:center;gap:6px;font-size:12.5px;font-weight:600;white-space:nowrap}
.sync i{width:8px;height:8px;border-radius:50%;background:var(--muted);flex:none}
.sync.live i{background:var(--ok);box-shadow:0 0 0 3px var(--ok-soft)}
.sync.syncing i{background:var(--acc);animation:pulse 1s ease-in-out infinite}
.sync.offline i,.sync.error i{background:var(--warn);box-shadow:0 0 0 3px var(--warn-soft)}
@keyframes pulse{50%{opacity:.3}}
.sync-btn{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:0 11px;height:34px;display:inline-flex;align-items:center}
@media (max-width:560px){.sync-btn .sync.live>span,.sync-btn .sync.syncing>span,.sync-btn .sync.offline>span{display:none}.sync-btn:has(.sync.live),.sync-btn:has(.sync.syncing),.sync-btn:has(.sync.offline){width:34px;padding:0;justify-content:center}}
.icon-btn{width:34px;height:34px;border-radius:8px;border:1px solid var(--line);background:var(--surface);display:grid;place-items:center;padding:0;color:var(--ink-2);text-decoration:none;flex:none}
.icon-btn svg{width:17px;height:17px}
.icon-btn.sm{width:30px;height:30px;border-radius:7px}
.icon-btn.sm svg{width:15px;height:15px}
.icon-btn:disabled{opacity:.35;cursor:default}
.sect{display:flex;flex-direction:column;gap:10px}
.sect+.sect{border-top:1px solid var(--line);padding-top:14px}

/* bottom nav */
.tabs-bottom{position:fixed;left:0;right:0;bottom:0;z-index:30;background:var(--surface);border-top:1px solid var(--line);
  padding:4px max(6px,env(safe-area-inset-right,0px)) calc(4px + env(safe-area-inset-bottom,0px)) max(6px,env(safe-area-inset-left,0px));display:grid;grid-template-columns:repeat(5,1fr)}
@media (min-width:900px){.tabs-bottom{display:none}}
.tabs-bottom button{border:0;background:none;display:flex;flex-direction:column;align-items:center;gap:2px;padding:7px 0 5px;font-size:11px;font-weight:600;color:var(--muted);position:relative}
.tabs-bottom svg{width:21px;height:21px}
.tabs-bottom button[aria-current="page"]{color:var(--acc)}
.tabs-bottom button[aria-current="page"]::before{content:"";position:absolute;top:-4px;left:30%;right:30%;height:2px;border-radius:2px;background:var(--acc)}
.badge{position:absolute;top:2px;left:calc(50% + 6px);min-width:16px;height:16px;padding:0 4px;border-radius:8px;background:var(--sun);color:#fff;font-size:10px;line-height:16px;font-weight:700;font-variant-numeric:tabular-nums}

/* avatars */
.av{--c:var(--frost);width:28px;height:28px;border-radius:50%;background:var(--c);color:#fff;display:inline-grid;place-items:center;font-weight:700;font-size:11px;flex:none}
.av.sm{width:22px;height:22px;font-size:9.5px}
.av.lg{width:42px;height:42px;font-size:15px}
.av.nobody{background:transparent;border:1.5px dashed var(--line);color:var(--muted)}

/* hero (trip tab only) */
.hero{display:grid;gap:12px;padding:12px 0 0;grid-template-columns:1fr}
@media (min-width:900px){.hero{grid-template-columns:1fr 1fr;align-items:start;gap:20px;padding-top:20px}}
.hero-copy{display:flex;flex-direction:column;gap:10px;min-width:0}
.dates{font-size:13px;color:var(--muted);font-weight:500}
.hero h1{font-size:clamp(24px,6.4vw,34px);font-weight:700;line-height:1.15;letter-spacing:-.02em}
.count{display:flex;gap:0;align-items:stretch;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow);overflow:hidden;flex-wrap:wrap}
.count .unit{display:flex;flex-direction:column;align-items:center;justify-content:center;padding:8px 12px;min-width:60px;border-right:1px solid var(--line)}
.count b{font-size:20px;font-weight:700;line-height:1.1;font-variant-numeric:tabular-nums}
.count span{font-size:11px;color:var(--muted);font-weight:500}
.count .label{flex:1;align-self:center;font-size:12.5px;color:var(--muted);padding:6px 12px;min-width:140px}
.crew{display:flex;align-items:center;gap:8px;flex-wrap:wrap;font-size:13px}
.stack{display:flex}
.stack .av{border:2px solid var(--bg);margin-left:-7px}
.stack .av:first-child{margin-left:0}

/* map */
.mapcard{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow);overflow:hidden;display:flex;flex-direction:column;min-width:0}
.mapcard header{display:flex;justify-content:space-between;align-items:center;padding:10px 14px;gap:8px;border-bottom:1px solid var(--line)}
.mapcard h2{font-size:14px;font-weight:600}
.mapcard .temp{font-size:12px;font-weight:500;color:var(--muted);font-variant-numeric:tabular-nums}
.mapwrap{position:relative;background:var(--surface-2)}
.map{display:block;width:100%;height:auto;max-height:380px;margin:0 auto}
.map .leg{fill:none;stroke-width:2.2;stroke-linecap:round}
.map .leg.train{stroke-dasharray:1 6;stroke-width:3.5}
.map .leg.bus{stroke-dasharray:7 5}
.map .leg.boat{stroke-dasharray:2 5;stroke-width:3}
.map .leg.dim{opacity:.2}
.map .leg.hi{stroke-width:3.6}
.map .lat{stroke:var(--line);stroke-width:1}
.map text{font-family:var(--f-body);fill:var(--ink);paint-order:stroke;stroke:var(--surface-2);stroke-width:3px;stroke-linejoin:round}
.map .latlabel{font-size:10px;fill:var(--muted);font-variant-numeric:tabular-nums}
.map .cityname{font-size:12.5px;font-weight:600;stroke-width:5px;cursor:pointer}
.map .cityname.sel{fill:var(--acc);font-weight:700}
.map .city{cursor:pointer;outline:none}
.map .city:hover .dot,.map .city:focus-visible .dot{stroke-width:4.5}
.map .plane-dot{fill:var(--ink)}
.legend{display:flex;gap:12px;flex-wrap:wrap;padding:8px 14px;font-size:12px;color:var(--muted);align-items:center;border-top:1px solid var(--line)}
.legend span{display:inline-flex;align-items:center;gap:5px}
.legend svg{width:22px;height:8px}
.legend .hint{margin-left:auto;gap:4px}
.legend .hint svg{width:13px;height:13px}

/* views */
main{padding-top:4px}
.view{display:flex;flex-direction:column;gap:12px;padding:12px 0 20px}
.view-head{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}
.view-head h2{font-size:21px;font-weight:700;line-height:1.2}
.view-head .sub{font-size:13px;color:var(--muted);margin-top:2px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow)}
.pad{padding:14px}
.grid-2{display:grid;gap:12px;grid-template-columns:1fr}
@media (min-width:760px){.grid-2{grid-template-columns:1fr 1fr}}
.grid-3{display:grid;gap:12px;grid-template-columns:1fr}
@media (min-width:760px){.grid-3{grid-template-columns:repeat(3,1fr)}}
.seg{display:inline-flex;background:var(--surface-2);border:1px solid var(--line);border-radius:10px;padding:3px;gap:2px;max-width:100%;overflow-x:auto;scrollbar-width:none}
.seg::-webkit-scrollbar{display:none}
.seg button{border:0;background:none;padding:6px 12px;border-radius:7px;font-weight:600;font-size:13px;color:var(--muted);white-space:nowrap;display:inline-flex;gap:6px;align-items:center;justify-content:center}
.seg button svg{width:15px;height:15px}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 2px rgba(16,24,40,.12)}
.seg.wide{display:flex}.seg.wide button{flex:1}
.sticky{position:sticky;top:calc(52px + env(safe-area-inset-top,0px));z-index:20;padding:6px 0;margin:-6px 0;background:var(--bg)}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:8px 13px;font-weight:600;font-size:13.5px;display:inline-flex;align-items:center;justify-content:center;gap:6px;white-space:nowrap;text-decoration:none;color:var(--ink)}
.btn svg{width:15px;height:15px}
.btn.primary{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.btn.sun,.btn.acc{background:var(--acc);color:var(--acc-ink);border-color:var(--acc)}
.btn.ghost{border-color:transparent;background:none}
.btn.danger{color:var(--bad)}
.btn.sm{padding:5px 10px;font-size:12.5px;border-radius:7px}
.btn.sm svg{width:13px;height:13px}
.chip{display:inline-flex;align-items:center;gap:4px;font-size:12px;font-weight:600;padding:2px 8px;border-radius:999px;background:var(--surface-2);color:var(--ink-2);border:1px solid var(--line);white-space:nowrap;font-variant-numeric:tabular-nums}
.chip svg{width:12px;height:12px;flex:none}
button.chip{cursor:pointer;font-family:inherit}
.chip.hot,.chip.warn{background:var(--warn-soft);color:var(--warn);border-color:transparent}
.chip.ok{background:var(--ok-soft);color:var(--ok);border-color:transparent}
.chip.cold{background:var(--frost-soft);color:var(--frost);border-color:transparent}
.chip.acc,.chip.pink{background:var(--acc-soft);color:var(--acc);border-color:transparent}
input[type=text],input[type=number],input[type=date],input[type=time],input[type=url],select,textarea{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:8px 10px;min-width:0;width:100%;font-size:15px}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--acc);box-shadow:0 0 0 3px var(--acc-soft)}
label.f{display:flex;flex-direction:column;gap:5px;font-size:12.5px;font-weight:600;color:var(--ink-2);min-width:0}
.flabel{font-size:12.5px;font-weight:600;color:var(--ink-2)}
.chk{display:flex;gap:8px;align-items:center;font-size:13.5px;cursor:pointer}
.chk input{width:18px;height:18px;accent-color:var(--acc)}
.alert{display:flex;gap:10px;padding:12px 14px;border-radius:var(--r);background:var(--warn-soft);color:var(--ink);font-size:13.5px;border:1px solid color-mix(in srgb,var(--warn) 25%,transparent)}
.alert>svg{width:18px;height:18px;color:var(--warn);flex:none;margin-top:1px}
.alert b{display:block}
.alert ul{margin:6px 0 0;padding-left:18px;display:flex;flex-direction:column;gap:5px}
.empty{padding:22px 16px;text-align:center;color:var(--muted);display:flex;flex-direction:column;align-items:center;gap:8px}
.empty>svg{width:26px;height:26px;color:var(--muted)}
.grow{flex:1;min-width:0}
.err{color:var(--bad);margin:0;font-size:13px}

/* quick stats */
.nextup{display:grid;gap:8px;grid-template-columns:repeat(3,minmax(0,1fr))}
.stat{padding:10px 12px;display:flex;flex-direction:column;gap:2px;min-width:0;text-align:left;border:1px solid var(--line);color:var(--ink)}
.stat .k{font-size:11.5px;font-weight:500;color:var(--muted);display:flex;gap:5px;align-items:center;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.stat .k svg{width:13px;height:13px;flex:none}
.stat .v{font-size:17px;font-weight:700;line-height:1.25;font-variant-numeric:tabular-nums;overflow-wrap:anywhere}
.stat .s{font-size:11.5px;color:var(--muted)}
.bar{height:5px;border-radius:3px;background:var(--surface-2);overflow:hidden;margin:3px 0}
.bar>span{display:block;height:100%;background:var(--acc);border-radius:3px;transition:width .5s}
@media (max-width:420px){.nextup .stat .s{display:none}}

/* days */
.toolbar{display:flex;gap:8px;align-items:center;flex-wrap:wrap;font-size:13px}
.btngrp{display:flex;gap:6px;margin-left:auto}
.days{display:flex;flex-direction:column;gap:8px}
.day{--c:var(--frost);overflow:hidden}
.day>button{all:unset;box-sizing:border-box;cursor:pointer;width:100%;display:grid;grid-template-columns:44px 1fr auto;gap:12px;align-items:center;padding:10px 12px}
.day>button:focus-visible{outline:2px solid var(--acc);outline-offset:-2px}
.dnum{width:44px;height:48px;border-radius:10px;background:color-mix(in srgb,var(--c) 12%,var(--surface));color:var(--c);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px}
.dnum b{font-size:18px;font-weight:700;line-height:1;font-variant-numeric:tabular-nums}
.dnum span{font-size:10px;font-weight:600}
.dtitle{display:flex;flex-direction:column;gap:2px;min-width:0}
.dtitle h3{font-size:15px;font-weight:600;line-height:1.3}
.dtitle .route{font-size:12.5px;color:var(--muted);display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.dtitle .route svg{width:13px;height:13px}
.chev{width:18px;height:18px;color:var(--muted);transition:transform .2s}
.day.open .chev{transform:rotate(180deg)}
.day.today{border-color:var(--acc);box-shadow:0 0 0 1px var(--acc)}
.dbody{padding:0 14px 14px 14px;display:flex;flex-direction:column;gap:10px;border-top:1px solid var(--line);padding-top:12px}
.steps{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;position:relative}
.steps::before{content:"";position:absolute;left:13px;top:14px;bottom:14px;width:1.5px;background:var(--line)}
.steps li{display:grid;grid-template-columns:28px 1fr;gap:2px 10px;align-items:start;padding:5px 0;position:relative}
.steps .ico{width:28px;height:28px;border-radius:50%;background:color-mix(in srgb,var(--c) 12%,var(--surface));color:var(--c);display:grid;place-items:center;grid-row:span 2}
.steps .ico svg{width:14px;height:14px}
.steps .t{font-size:12px;font-weight:600;color:var(--muted);padding-top:1px;font-variant-numeric:tabular-nums}
.steps .x{min-width:0;font-size:14px;line-height:1.45}
.steps .t:empty{display:none}
.tip{font-size:13px;background:var(--surface-2);border-radius:8px;padding:8px 10px;color:var(--ink-2);display:flex;gap:8px}
.tip svg{width:15px;height:15px;color:var(--warn);flex:none;margin-top:2px}
.sleep{display:flex;gap:6px;align-items:center;font-size:13px;color:var(--muted);flex-wrap:wrap}
.sleep>svg{width:15px;height:15px}
.dactions{display:flex;gap:6px;flex-wrap:wrap}
.seeing{display:flex;gap:5px;flex-wrap:wrap;align-items:center}
.dres{display:flex;flex-direction:column;gap:6px}
.dres button{all:unset;box-sizing:border-box;cursor:pointer;display:flex;gap:10px;align-items:center;padding:8px 10px;border:1px solid var(--line);border-radius:8px;background:var(--surface-2);font-size:13px}
.dres button:hover{border-color:var(--acc)}
.dres button svg{width:15px;height:15px;color:var(--acc);flex:none}
.dres .no{color:var(--warn)}
.dres .no svg{color:var(--warn)}
.addday{border:1px dashed var(--line);background:none;border-radius:var(--r);padding:11px;font-weight:600;font-size:13.5px;color:var(--acc);display:flex;gap:7px;justify-content:center;align-items:center;width:100%}
.addday svg{width:16px;height:16px}
.addday:hover{border-color:var(--acc);background:var(--surface)}

/* places to see */
.cities{display:flex;gap:8px;overflow-x:auto;scroll-snap-type:x proximity;padding:2px 16px 6px;margin:-2px -16px -4px;scrollbar-width:none;-webkit-overflow-scrolling:touch}
.cities::-webkit-scrollbar{display:none}
.citycard{--c:var(--sea);flex:0 0 auto;scroll-snap-align:start;text-align:left;border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:8px 12px 8px 14px;display:flex;flex-direction:column;gap:1px;position:relative;overflow:hidden}
.citycard::before{content:"";position:absolute;left:0;top:0;bottom:0;width:3px;background:var(--c)}
.citycard b{font-size:14px;font-weight:600;line-height:1.25;white-space:nowrap}
.citycard span{font-size:11.5px;color:var(--muted);white-space:nowrap}
.citycard[aria-pressed="true"]{border-color:var(--acc);background:var(--acc-soft)}
.cityhead{--c:var(--sea);padding:14px;display:flex;flex-direction:column;gap:8px}
.cityhead .ch-top{display:flex;justify-content:space-between;align-items:center;gap:10px}
.cityhead h3{font-size:20px;font-weight:700;line-height:1.2;display:flex;gap:8px;align-items:center}
.cityhead h3 i{width:10px;height:10px;border-radius:50%;background:var(--c);flex:none}
.cityhead .meta{display:flex;gap:6px;flex-wrap:wrap}
.cityhead p{margin:0;color:var(--ink-2);font-size:14px}
.sgroup-h{display:flex;justify-content:space-between;align-items:baseline;gap:8px;font-size:13px;font-weight:600;margin:6px 2px -4px;color:var(--ink-2)}
.sgroup-h .muted{font-weight:500;font-size:12px}
.sights{display:grid;gap:8px;grid-template-columns:1fr}
@media (min-width:760px){.sights{grid-template-columns:1fr 1fr}}
.sight{--c:var(--sea);display:grid;grid-template-columns:36px 1fr;gap:10px;padding:11px 12px;min-width:0}
.sight .sk{width:36px;height:36px;border-radius:9px;display:grid;place-items:center;background:color-mix(in srgb,var(--c) 12%,var(--surface));color:var(--c)}
.sight .sk svg{width:18px;height:18px}
.sight .sbody{min-width:0;display:flex;flex-direction:column}
.sight h4{font-size:14.5px;font-weight:600;line-height:1.3}
.sight .smeta{font-size:12px;font-weight:500;color:var(--muted);margin-top:1px}
.sight p{margin:4px 0 0;font-size:13.5px;color:var(--ink-2);line-height:1.45}
.sfoot{display:flex;align-items:center;gap:6px;margin-top:8px;flex-wrap:wrap}
.sfoot .stack .av{border-color:var(--surface)}
.vote{border:1px solid var(--line);background:var(--surface);border-radius:7px;padding:4px 10px;font-weight:600;font-size:12.5px;display:inline-flex;gap:5px;align-items:center;color:var(--ink-2)}
.vote svg{width:14px;height:14px}
.vote[aria-pressed="true"]{background:var(--acc-soft);border-color:transparent;color:var(--acc)}
.vote[aria-pressed="true"] svg path{fill:currentColor}

/* bookings */
.progress{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.progress .stat .v{font-size:16px}
.reslist{display:flex;flex-direction:column;gap:8px}
.res{--c:var(--acc);padding:0;overflow:hidden}
.res-h{display:flex;align-items:center;gap:10px;padding:11px 12px}
.res-h .ri{width:34px;height:34px;border-radius:9px;display:grid;place-items:center;background:color-mix(in srgb,var(--c) 12%,var(--surface));color:var(--c);flex:none}
.res-h .ri svg{width:17px;height:17px}
.res-h .rt{min-width:0;flex:1}
.res-h .rt b{display:block;font-size:14.5px;font-weight:600;line-height:1.3}
.res-h .rt span{font-size:12.5px;color:var(--muted)}
.res-b{border-top:1px dashed var(--line);padding:10px 12px 12px;display:flex;flex-direction:column;gap:8px}
.times{display:grid;grid-template-columns:1fr auto 1fr;gap:8px;align-items:center}
.times div{display:flex;flex-direction:column;min-width:0}
.times div:last-child{text-align:right}
.times b{font-size:18px;font-weight:700;font-variant-numeric:tabular-nums;line-height:1.2}
.times span{font-size:12px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.times svg{width:16px;height:16px;color:var(--muted)}
.rmeta{display:flex;gap:6px;flex-wrap:wrap;align-items:center;font-size:13px}
.code{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--surface-2);border-radius:7px;padding:3px 4px 3px 9px;font-weight:700;font-size:13px;letter-spacing:.04em;font-variant-numeric:tabular-nums}
.code button{border:0;background:var(--surface);border-radius:5px;width:24px;height:24px;display:grid;place-items:center;color:var(--muted);padding:0}
.code button svg{width:13px;height:13px}
.ractions{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.res.todo .res-h{opacity:.95}
.res.todo .ri{background:var(--warn-soft);color:var(--warn)}
.rnote{font-size:13px;color:var(--ink-2);background:var(--surface-2);border-radius:7px;padding:7px 9px}

/* tasks */
.tasks{display:flex;flex-direction:column;overflow:hidden}
.task{display:grid;grid-template-columns:auto 1fr auto;gap:10px;align-items:start;padding:10px 12px;border-top:1px solid var(--line)}
.task:first-child{border-top:0}
.ck{appearance:none;-webkit-appearance:none;width:20px;height:20px;border-radius:6px;border:1.5px solid color-mix(in srgb,var(--muted) 60%,transparent);background:var(--surface);margin:1px 0 0;display:grid;place-items:center;transition:all .15s;cursor:pointer;flex:none}
.ck:checked{background:var(--acc);border-color:var(--acc)}
.ck:checked::after{content:"";width:5px;height:9px;border:solid var(--acc-ink);border-width:0 2px 2px 0;transform:rotate(45deg) translate(-1px,-1px)}
.task.done .ttl{color:var(--muted);text-decoration:line-through;text-decoration-thickness:1px}
.ttl{font-weight:500;font-size:14px;line-height:1.4}
.tmeta{display:flex;gap:5px;flex-wrap:wrap;margin-top:5px;align-items:center}
.task details{margin-top:6px}
.task summary{font-size:12.5px;color:var(--acc);font-weight:600;cursor:pointer;list-style:none;display:inline-flex;gap:4px;align-items:center}
.task summary::-webkit-details-marker{display:none}
.task summary svg{width:13px;height:13px}
.tfields{display:grid;grid-template-columns:1.4fr 1fr 86px;gap:6px;margin-top:6px}
@media (max-width:560px){.tfields{grid-template-columns:1fr 1fr}}
.owner{border:0;background:none;padding:0;border-radius:50%}
.group-h{padding:8px 12px;font-size:12.5px;font-weight:600;color:var(--ink-2);display:flex;justify-content:space-between;align-items:center;border-top:1px solid var(--line);background:var(--surface-2)}
.group-h:first-child{border-top:0}
.group-h span:first-child{display:flex;gap:6px;align-items:center}
.group-h svg{width:14px;height:14px;color:var(--muted)}
.ring{width:48px;height:48px;flex:none}
.ring circle{fill:none;stroke-width:6}
.ring .bg{stroke:var(--surface-2)}
.ring .fg{stroke:var(--acc);stroke-linecap:round;transition:stroke-dashoffset .6s}
.ringrow{display:flex;align-items:center;gap:12px}

/* money */
.money-top{display:grid;gap:8px;grid-template-columns:1fr 1fr}
@media (min-width:760px){.money-top{grid-template-columns:repeat(4,1fr)}}
.money-top .stat .v{font-size:16px}
.xlist{display:flex;flex-direction:column;overflow:hidden}
.xrow{display:grid;grid-template-columns:auto 1fr auto;gap:10px;align-items:center;padding:10px 12px;border-top:1px solid var(--line)}
.xrow:first-child{border-top:0}
.xrow .amt{text-align:right;font-size:14px;font-weight:600;font-variant-numeric:tabular-nums}
.xrow .amt small{display:block;color:var(--muted);font-size:11.5px;font-weight:500}
.xrow .who{display:flex;gap:5px;align-items:center;font-size:12.5px;color:var(--muted);flex-wrap:wrap}
.xrow .split{display:flex}
.xrow .split .av{border:2px solid var(--surface);margin-left:-6px}
.xrow .split .av:first-child{margin-left:0}
.cat{width:34px;height:34px;border-radius:9px;display:grid;place-items:center;background:var(--surface-2);color:var(--ink-2)}
.cat svg{width:17px;height:17px}
.balrow{display:grid;grid-template-columns:auto 1fr minmax(90px,auto);gap:10px;align-items:center;padding:8px 0}
.balrow .num{text-align:right;font-weight:600}
.balbar{position:relative;height:8px;background:var(--surface-2);border-radius:4px}
.balbar i{position:absolute;top:0;bottom:0;border-radius:4px}
.balbar::after{content:"";position:absolute;left:50%;top:-3px;bottom:-3px;width:1.5px;background:var(--muted);opacity:.5}
.transfer{display:flex;align-items:center;gap:8px;padding:9px 0;border-top:1px dashed var(--line);flex-wrap:wrap;font-size:14px}
.transfer:first-child{border-top:0}
.transfer .arrow{color:var(--muted)}
.transfer .amt{margin-left:auto;font-weight:700;font-variant-numeric:tabular-nums}
.est{display:grid;grid-template-columns:1fr;gap:3px;padding:10px 0;border-top:1px solid var(--line)}
.est:first-child{border-top:0}
.est-top{display:flex;justify-content:space-between;gap:10px;align-items:center;flex-wrap:wrap;font-size:14px}
.range{position:relative;height:16px;margin-top:3px}
.range .track{position:absolute;left:0;right:0;top:6px;height:4px;background:var(--surface-2);border-radius:2px}
.range .band{position:absolute;top:3px;height:10px;border-radius:5px;background:var(--acc-soft);border:1px solid var(--acc)}
.range .act{position:absolute;top:0;width:3px;height:16px;border-radius:2px;background:var(--sun)}
.est input{width:90px;padding:4px 8px;font-size:14px;text-align:right}
.conv{display:grid;grid-template-columns:1fr 96px;gap:8px}
.conv-out{display:grid;grid-template-columns:repeat(2,1fr);gap:6px;margin-top:10px}
.conv-out div{background:var(--surface-2);border-radius:8px;padding:8px 10px;display:flex;justify-content:space-between;gap:6px;font-size:14px;font-weight:600;font-variant-numeric:tabular-nums}
.conv-out span{color:var(--muted);font-size:12px;font-weight:600}
.fab{position:fixed;right:max(16px,env(safe-area-inset-right,0px));bottom:calc(72px + env(safe-area-inset-bottom,0px));z-index:25;border:0;border-radius:12px;background:var(--acc);color:var(--acc-ink);padding:11px 15px;font-weight:600;font-size:14px;display:flex;gap:6px;align-items:center;box-shadow:0 6px 16px -6px rgba(14,111,120,.55)}
.fab svg{width:18px;height:18px}
@media (min-width:900px){.fab{bottom:24px}}

/* pack */
.packcol{--c:var(--frost);overflow:hidden}
.packcol h3{display:flex;justify-content:space-between;align-items:center;padding:10px 14px;font-size:14px;font-weight:600;gap:8px;border-bottom:1px solid var(--line);border-top:3px solid var(--c)}
.packcol h3 small{font-size:12px;font-weight:500;color:var(--muted);font-variant-numeric:tabular-nums}
.packcol ul{list-style:none;margin:0;padding:4px 14px 8px}
.packcol li label{display:flex;gap:10px;align-items:center;padding:6px 0;cursor:pointer;font-size:14px}
.packcol li input:checked+span{color:var(--muted);text-decoration:line-through}
.packcol .ck{width:18px;height:18px;border-radius:5px}
.packcol .ck:checked::after{width:4px;height:8px}
.addpack{display:flex;gap:6px;padding:0 14px 12px}
.addpack .btn{padding:8px 11px}

/* info */
.info h3{font-size:14.5px;font-weight:600;display:flex;align-items:center;gap:7px}
.info h3 svg{width:16px;height:16px;color:var(--acc)}
.kv{display:grid;grid-template-columns:auto 1fr;gap:5px 12px;font-size:13.5px;margin-top:8px}
.kv dt{color:var(--muted)} .kv dd{margin:0}
.tbl{width:100%;border-collapse:collapse;font-size:13.5px;margin-top:6px}
.tbl th{text-align:left;font-size:12px;font-weight:600;color:var(--muted);padding:5px 4px;border-bottom:1px solid var(--line)}
.tbl td{padding:7px 4px;border-bottom:1px solid var(--line);vertical-align:middle}
.tbl td.n{text-align:right;white-space:nowrap;font-variant-numeric:tabular-nums;font-weight:600}
.tblwrap{overflow-x:auto}
.phr{display:grid;grid-template-columns:1fr auto;gap:1px 12px;padding:7px 0;border-top:1px dashed var(--line)}
.phr:first-child{border-top:0}
.phr .nat{font-size:17px} .phr .rom{font-size:12.5px;color:var(--muted)} .phr .en{grid-row:span 2;align-self:center;font-size:13px;text-align:right;color:var(--ink-2)}
.tempbar{display:inline-block;height:6px;border-radius:3px;vertical-align:middle}
.sources a{color:var(--acc)}

/* dialogs */
dialog{border:0;padding:0;border-radius:16px;background:var(--surface);color:var(--ink);width:min(540px,calc(100vw - 24px));max-height:calc(100dvh - 40px);box-shadow:0 24px 60px -18px rgba(16,24,40,.45)}
dialog::backdrop{background:rgba(16,20,24,.45)}
@media (max-width:600px){dialog{margin:auto auto 0;width:100%;max-width:100%;border-radius:16px 16px 0 0;padding-bottom:env(safe-area-inset-bottom,0px)}}
.dlg{display:flex;flex-direction:column;max-height:inherit}
.dlg-h{display:flex;justify-content:space-between;align-items:center;padding:13px 16px;border-bottom:1px solid var(--line);gap:10px}
.dlg-h h2{font-size:16px;font-weight:600}
.dlg-b{padding:14px 16px;overflow:auto;display:flex;flex-direction:column;gap:12px}
.dlg-f{padding:10px 16px;border-top:1px solid var(--line);display:flex;justify-content:flex-end;gap:8px;flex-wrap:wrap}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.pick{display:flex;gap:6px;flex-wrap:wrap}
.pick button{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:4px 11px 4px 4px;display:inline-flex;align-items:center;gap:7px;font-weight:600;font-size:13.5px}
.pick button svg{width:14px;height:14px}
.pick button.txt{padding:6px 12px}
.pick button[aria-pressed="true"]{border-color:var(--acc);background:var(--acc-soft);color:var(--acc)}
input.amount-big{font-size:30px;font-weight:700;border:0!important;box-shadow:none!important;padding:0!important;background:transparent!important;width:100%}
.people-edit{display:flex;flex-direction:column;gap:8px}
.people-edit .r{display:grid;grid-template-columns:auto 1fr auto;gap:8px;align-items:center}
.swatches{display:flex;gap:4px}
.swatches button{width:22px;height:22px;border-radius:50%;border:2px solid transparent;padding:0}
.swatches button[aria-pressed="true"]{border-color:var(--ink)}
.whoami{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.whoami button{border:1px solid var(--line);background:var(--surface-2);border-radius:12px;padding:14px;display:flex;flex-direction:column;align-items:center;gap:6px;font-weight:600}
.whoami button:hover{border-color:var(--acc)}
textarea{min-height:70px;resize:vertical;font-size:14px}
textarea.code-in{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:12px}
.fgroup{display:flex;flex-direction:column;gap:7px}
.mvrow,.strow{border:1px solid var(--line);border-radius:10px;background:var(--surface-2);padding:8px;display:grid;gap:6px}
.mv{display:grid;grid-template-columns:1fr auto 1fr;gap:6px;align-items:center}
.mv2{display:grid;grid-template-columns:1fr auto;gap:6px}
.strow{grid-template-columns:minmax(0,1fr) 84px auto}
.strow textarea{grid-column:1/-1;min-height:0}
.stbtns{display:flex;gap:4px}
.mvrow select,.strow select{padding:7px 8px;font-size:14px}
@media (max-width:420px){.strow{grid-template-columns:minmax(0,1fr) 76px}.stbtns{grid-column:1/-1;justify-content:flex-end;order:3}}
.plist{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;border:1px solid var(--line);border-radius:10px;max-height:46vh;overflow:auto}
.plist li+li{border-top:1px solid var(--line)}
.plist button{all:unset;box-sizing:border-box;cursor:pointer;display:flex;justify-content:space-between;gap:10px;width:100%;padding:10px 12px;font-weight:600}
.plist button .muted{font-weight:400;font-size:12.5px;text-align:right}
.plist button:hover,.plist button:focus-visible{background:var(--surface-2)}
.dtrow{display:grid;grid-template-columns:1.3fr 1fr;gap:6px}

/* toast + banner */
.toast{position:fixed;left:50%;bottom:calc(86px + env(safe-area-inset-bottom,0px));transform:translateX(-50%) translateY(16px);opacity:0;background:var(--ink);color:var(--bg);padding:9px 14px;border-radius:10px;font-weight:600;font-size:13.5px;z-index:60;transition:all .2s;pointer-events:none;max-width:calc(100vw - 32px)}
.toast.on{opacity:1;transform:translateX(-50%) translateY(0)}
@media (min-width:900px){.toast{bottom:28px}}
.banner{display:flex;gap:10px;align-items:center;flex-wrap:wrap;background:var(--acc-soft);border:1px solid color-mix(in srgb,var(--acc) 35%,transparent);border-radius:var(--r);padding:11px 14px;margin-top:10px;font-size:13.5px}
.banner p{margin:0;flex:1;min-width:200px}
.banner>svg{width:20px;height:20px;color:var(--acc)}
footer.foot{padding:16px 0 8px;color:var(--muted);font-size:12px;border-top:1px solid var(--line);margin-top:8px}

@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}
</style>
</head>
<body>

<div class="top" id="top">
  <div class="shell">
    <div class="brand"><i aria-hidden="true" id="brandIco"></i><span>Тал → Самуй</span></div>
    <nav class="tabs-top" aria-label="Хэсгүүд" id="tabsTop"></nav>
    <div class="spacer"></div>
    <button class="sync-btn" id="syncBtn" type="button" aria-label="Синк ба тохиргоо"></button>
    <button class="me-btn" id="meBtn" type="button" aria-label="Хэн бэ гэдгээ солих"></button>
    <button class="icon-btn" id="themeBtn" type="button" aria-label="Цайвар эсвэл бараан"></button>
    <button class="icon-btn" id="settingsBtn" type="button" aria-label="Тохиргоо"></button>
  </div>
</div>

<div class="shell">
  <div id="importBanner"></div>

  <section class="hero" id="hero" aria-label="Аялал">
    <div class="hero-copy">
      <div class="dates" id="eyebrow"></div>
      <h1>Тал нутгаас Самуй руу</h1>
      <div class="count" id="count" aria-live="polite"></div>
      <div class="crew" id="crew"></div>
    </div>
    <div class="mapcard">
      <header><h2>Маршрут</h2><span class="temp" id="mapTemp"></span></header>
      <div class="mapwrap" id="map"></div>
      <div class="legend" id="mapLegend"></div>
    </div>
  </section>

  <main>
    <section class="view" id="v-trip" data-view="trip"></section>
    <section class="view" id="v-book" data-view="book" hidden></section>
    <section class="view" id="v-money" data-view="money" hidden></section>
    <section class="view" id="v-pack" data-view="pack" hidden></section>
    <section class="view" id="v-info" data-view="info" hidden></section>
  </main>

  <footer class="foot">
    Шууд синк асаалттай үед таны өөрчлөлт бүх хүний утсанд гарна. Синкгүй бол зөвхөн энэ утсанд хадгалагдана. Цаг бүр орон нутгийн цагаар: Хятад UTC+8 (Улаанбаатартай ижил), Тайланд UTC+7.
  </footer>
</div>

<nav class="tabs-bottom" id="tabsBottom" aria-label="Хэсгүүд"></nav>
<button class="fab" id="fab" type="button" hidden></button>
<div class="toast" id="toast" role="status"></div>

<dialog id="dlg"><div class="dlg" id="dlgInner"></div></dialog>

<script>
"use strict";
/* ================= ICONS ================= */
const I={
 trip:'<path d="M3 18 9 6l4 8 3-5 5 9z" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/>',
 book:'<rect x="4" y="3" width="16" height="18" rx="3" fill="none" stroke="currentColor" stroke-width="2"/><path d="m8 12 3 3 5-6" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>',
 money:'<rect x="2.5" y="6" width="19" height="13" rx="3" fill="none" stroke="currentColor" stroke-width="2"/><circle cx="12" cy="12.5" r="2.8" fill="none" stroke="currentColor" stroke-width="2"/><path d="M5 3.5h14" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>',
 pack:'<rect x="4" y="7" width="16" height="13" rx="3" fill="none" stroke="currentColor" stroke-width="2"/><path d="M9 7V5a2 2 0 0 1 2-2h2a2 2 0 0 1 2 2v2M4 12h16" fill="none" stroke="currentColor" stroke-width="2"/>',
 info:'<circle cx="12" cy="12" r="9" fill="none" stroke="currentColor" stroke-width="2"/><path d="M12 11v6M12 7.5v.5" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"/>',

const WD=["Ням","Даваа","Мягмар","Лхагва","Пүрэв","Баасан","Бямба"];
const dparts=iso=>{const[y,m,d]=String(iso).split("-").map(Number);return{y,m,d,w:new Date(Date.UTC(y,m-1,d)).getUTCDay()}};
const dlabel=iso=>{const p=dparts(iso);return `${p.m}-р сарын ${p.d}`};
const dlong=iso=>{const p=dparts(iso);return `${p.m}-р сарын ${p.d}, ${WD[p.w].toLowerCase()}`};
const ddot=iso=>{const p=dparts(iso);return `${p.y}.${String(p.m).padStart(2,"0")}.${String(p.d).padStart(2,"0")}`};
const addDays=(iso,n)=>{const d=new Date(iso+"T12:00:00Z");d.setUTCDate(d.getUTCDate()+n);return d.toISOString().slice(0,10)};
function rangeText(a,b){const A=dparts(a),B=dparts(b);return A.m===B.m?`${A.m}-р сарын ${A.d}–${B.d}`:`${dlabel(a)} – ${dlabel(b)}`}

/* ================= PLAN HELPERS ================= */
const MODES={train:["Галт тэрэг","train"],plane:["Нислэг","plane"],bus:["Автобус, машин","bus"],boat:["Завь","boat"]};
const STEP={walk:["Алхах, үзэх","walk"],star:["Үзвэр","star"],food:["Хоол","food"],train:["Галт тэрэг","train"],plane:["Нислэг","plane"],bus:["Автобус, машин","bus"],boat:["Завь","boat"],hotel:["Буудал","hotel"],doc:["Хил, бичиг баримт","doc"],sun:["Далайн эрэг","sun"],party:["Үдэшлэг","party"],bed:["Амрах","bed"],moon:["Шөнө","moon"]};
const SK={see:["Үзвэр","star","sea"],temple:["Сүм хийд","temple","sun"],museum:["Музей","museum","frost"],food:["Хоол","food","sun"],night:["Шөнийн амьдрал","party","frost"],beach:["Далайн эрэг","sun","sun"],nature:["Байгаль","nature","ok"],tour:["Аялал","boat","sea"],shop:["Дэлгүүр","bag","warn"]};
const ISO=/^\d{4}-\d\d-\d\d$/;
function place(k){if(!k)return null;const c=S.places&&S.places[k];if(c&&!c.deleted&&c.n)return c;return PLACES[k]||GAZ[k]||null}
const pname=k=>place(k)?.n||"Тодорхойгүй газар";
const pemo=k=>place(k)?.e||"📍";
const hasGeo=k=>{const p=place(k);return!!p&&isFinite(p.lat)&&isFinite(p.lon)};
function dayList(){const m=new Map();DAYS.forEach(d=>m.set(d.date,d));
 Object.entries(S.days||{}).forEach(([k,v])=>{if(!ISO.test(k)||!v||typeof v!=="object")return;if(v.deleted)m.delete(k);else m.set(k,{...v,date:k})});
 const out=[...m.values()].sort((a,b)=>a.date.localeCompare(b.date));return out.length?out:[DAYS[0]]}
const movesOf=d=>Array.isArray(d?.moves)?d.moves.filter(m=>Array.isArray(m)&&m[0]&&m[1]):[];
const stepsOf=d=>Array.isArray(d?.steps)?d.steps.filter(Array.isArray):[];
function seqOf(d){const s=[];movesOf(d).forEach(([a,b])=>{if(s[s.length-1]!==a)s.push(a);s.push(b)});return s}
function routeText(d){const s=seqOf(d);if(s.length)return s.map(pname).join(" → ");return d.stay?pname(d.stay):(d.note||"")}
const modeEmo=d=>[...new Set(movesOf(d).map(m=>MODES[m[2]]?.[1]||"plane"))].map(i=>ico(i)).join("");
const startCity=d=>movesOf(d)[0]?.[0]||d.stay||"";
const endCity=d=>{const m=movesOf(d);return m.length?m[m.length-1][1]:(d.stay||"")};
const tzs=n=>"UTC"+(n>=0?"+":"−")+Math.abs(n);
function tzText(d){const a=place(startCity(d))?.tz,b=place(endCity(d))?.tz;if(a==null&&b==null)return"";if(a==null||b==null||a===b)return tzs(a??b);return tzs(a)+" → "+tzs(b)}
const climate=lat=>lat==null||!isFinite(lat)?"sea":lat>38?"frost":lat>20?"sea":"sun";
const cityColor=k=>climate(place(k)?.lat);
const dayColor=d=>cityColor(endCity(d)||startCity(d));
const sleepText=d=>d.stay?pname(d.stay):(d.note||"Тодорхойгүй");
const sg=v=>v>0?"+"+v:v<0?"−"+(-v):"0";
const tempText=k=>{const p=place(k);return p&&p.hi!=null&&p.lo!=null?`${sg(p.hi)}° / ${sg(p.lo)}°`:""};
function legs(){const o=[];dayList().forEach(d=>movesOf(d).forEach(([a,b,m])=>{if(a!==b)o.push({a,b,m:MODES[m]?m:"plane",d:d.date})}));return o}
function routeCities(){const k=[];const add=x=>{if(x&&place(x)&&!k.includes(x))k.push(x)};dayList().forEach(d=>{seqOf(d).forEach(add);add(d.stay)});return k}
const homeCity=()=>movesOf(dayList()[0])[0]?.[0]||"";
function cityStays(){const home=homeCity(),ds=dayList();
 return routeCities().filter(k=>k!==home||ds.some(d=>d.stay===k)).map(k=>({k,
  nights:ds.filter(d=>d.stay===k).map(d=>d.date),
  dates:ds.filter(d=>d.stay===k||seqOf(d).includes(k)).map(d=>d.date)}))}
function stayText(c){if(!c)return"";if(c.nights.length){const n=c.nights.length;return `${rangeText(c.nights[0],addDays(c.nights[n-1],1))}, ${n} шөнө`}
 return c.dates.length?`Түр зогсоно, ${dlabel(c.dates[c.dates.length-1])}`:""}
function sightList(){const m=new Map();SIGHTS.forEach(s=>m.set(s.id,s));
 Object.entries(S.sights||{}).forEach(([id,v])=>{if(!v||typeof v!=="object")return;if(v.deleted)m.delete(id);else if(v.n&&v.city)m.set(id,{...v,id})});return[...m.values()]}
const votesFor=id=>S.people.filter(p=>S.votes&&S.votes[id+"."+p.id]?.v).map(p=>p.id);
const mapsURL=q=>"https://www.google.com/maps/search/?api=1&query="+encodeURIComponent(q);
function departAt(){const f=dayList()[0];return f.date==="2026-12-25"?DEPART0:new Date(f.date+"T09:00:00+08:00")}
function homeAt(){const ds=dayList();return new Date(ds[ds.length-1].date+"T23:00:00+08:00")}

 $("#crew").innerHTML=`<div class="stack">${S.people.map(p=>av(p.id)).join("")}</div><span class="muted">${S.people.map(p=>esc(p.name)).join(", ")}</span>`;

function tripDayIndex(d=new Date()){const ds=dayList(),t=d.getTime();if(t<departAt().getTime()-20*3600e3)return -1;
 for(let i=ds.length-1;i>=0;i--){const s=new Date(ds[i].date+"T00:00:00+08:00").getTime();if(t>=s)return t>homeAt().getTime()?99:i}return -1}
function renderHero(){const ds=dayList();
 $("#eyebrow").textContent=`${ddot(ds[0].date)} – ${ddot(ds[ds.length-1].date)}, ${ds.length} өдөр, ${routeCities().length} хот`}
function renderCount(){
 const t=now(),el=$("#count"),DEP=departAt();
 if(t<DEP.getTime()){let s=Math.floor((DEP-t)/1000);const d=Math.floor(s/86400);s%=86400;const h=Math.floor(s/3600);s%=3600;const m=Math.floor(s/60);s%=60;
  el.innerHTML=[[d,"өдөр"],[h,"цаг"],[m,"мин"],[s,"сек"]].map(([v,l],i)=>`<div class="unit"><b>${i?String(v).padStart(2,"0"):v}</b><span>${l}</span></div>`).join("")+`<div class="label">${DEP===DEPART0?"20:22-ын галт тэрэг Улаанбаатараас хөдлөх хүртэл":"Аялал эхлэх хүртэл"}</div>`}
 else if(t<homeAt().getTime()){const i=tripDayIndex(),ds=dayList();el.innerHTML=`<div class="unit"><b>${i+1}-р өдөр</b><span>/ ${ds.length}</span></div><div class="label">${esc(ds[i]?.title||"Замдаа")}</div>`}
 else el.innerHTML=`<div class="unit"><b>Дууслаа</b><span>2027</span></div><div class="label">Тавтай морил гэртээ! Мөнгөний тооцоогоо хийгээрэй.</div>`;
}

/* ================= MAP ================= */
let hiDay=null;
const BEND={"het>sha":.18,"sha>bkk":.12,"bkk>usm":.5,"bkk>ub":.22};
const bendOf=(a,b)=>BEND[a+">"+b]??(BEND[b+">"+a]!=null?-BEND[b+">"+a]:(a<b?.15:-.15));
function renderMap(){
 const ks=routeCities().filter(hasGeo),L=legs().filter(l=>hasGeo(l.a)&&hasGeo(l.b));
 const tp=ks.map(place).filter(p=>p.hi!=null&&p.lo!=null);
 $("#mapTemp").textContent=tp.length?`${sg(Math.min(...tp.map(p=>p.lo)))}°C → ${sg(Math.max(...tp.map(p=>p.hi)))}°C`:"";
 if(!ks.length){$("#map").innerHTML=`<div class="empty">Өдөрт аялал нэмэхэд маршрут энд зурагдана.</div>`;$("#mapLegend").innerHTML="";return}
 const lats=ks.map(k=>place(k).lat),lons=ks.map(k=>place(k).lon);
 const la1=Math.max(...lats),la0=Math.min(...lats),lo1=Math.max(...lons),lo0=Math.min(...lons);
 const latR=Math.max(la1-la0,4),lonR=Math.max(lo1-lo0,1);
 const W=360,H=Math.round(Math.min(380,Math.max(280,latR*8.2+70))),PT=26,PX=78;
 const ys=(H-2*PT)/latR,xs=Math.min((W-2*PX)/lonR,ys*1.25),lm=(la1+la0)/2,om=(lo1+lo0)/2;
 const proj=(lat,lon)=>[W/2+(lon-om)*xs,H/2-(lat-lm)*ys];
 let s=`<svg class="map" viewBox="0 0 ${W} ${H}" role="group" aria-label="Маршрутын зураг: ${esc(ks.map(pname).join(", "))}">`;
 const step=latR>24?15:latR>10?10:5,top=lm+(H/2)/ys,bot=lm-(H/2)/ys;
 for(let la=Math.ceil(bot/step)*step;la<top;la+=step){const y=proj(la,om)[1];if(y<16||y>H-8)continue;
  s+=`<line class="lat" x1="0" x2="${W}" y1="${y.toFixed(1)}" y2="${y.toFixed(1)}"/><text class="latlabel" x="8" y="${(y-5).toFixed(1)}">${Math.abs(la)}°${la>0?"N":la<0?"S":""}</text>`}
 if(23.44<top-.5&&23.44>bot+.5){const y=proj(23.44,om)[1].toFixed(1);s+=`<line x1="0" x2="${W}" y1="${y}" y2="${y}" stroke="var(--pink)" stroke-opacity=".45" stroke-dasharray="4 5"/><text class="latlabel" x="8" y="${y-5}" style="fill:var(--pink)">Хойд тропик</text>`}
 const curves=[];
 L.forEach((l,i)=>{const A=place(l.a),B=place(l.b);const[x0,y0]=proj(A.lat,A.lon),[x1,y1]=proj(B.lat,B.lon);
  const k=bendOf(l.a,l.b),mx=(x0+x1)/2,my=(y0+y1)/2,dx=x1-x0,dy=y1-y0,cx=mx-dy*k,cy=my+dx*k;curves.push([x0,y0,cx,cy,x1,y1]);
  const cls=["leg",l.m];if(hiDay)cls.push(l.d===hiDay?"hi":"dim");
  const col=l.m==="train"?"var(--frost)":B.lat>38?"var(--violet)":"var(--pink)";
  s+=`<path class="${cls.join(" ")}" id="leg${i}" d="M${x0.toFixed(1)} ${y0.toFixed(1)} Q${cx.toFixed(1)} ${cy.toFixed(1)} ${x1.toFixed(1)} ${y1.toFixed(1)}" stroke="${col}"/>`});
 const pts=[];curves.forEach(([x0,y0,cx,cy,x1,y1])=>{for(let t=0;t<=1.0001;t+=1/40){const u=1-t;pts.push([u*u*x0+2*u*t*cx+t*t*x1,u*u*y0+2*u*t*cy+t*t*y1])}});
 const nodes=ks.map(k=>{const[x,y]=proj(place(k).lat,place(k).lon);return{k,x,y}});
 const C=[[13,5,"start"],[-13,5,"end"],[0,-13,"middle"],[0,23,"middle"],[10,-9,"start"],[10,19,"start"],[-10,-9,"end"],[-10,19,"end"]];
 const boxes=[];
 nodes.forEach(nd=>{const w=pname(nd.k).length*7.7+6,h=17;let best=null;
  C.forEach(([dx,dy,an],ci)=>{const bx=an==="start"?nd.x+dx:an==="end"?nd.x+dx-w:nd.x+dx-w/2,by=nd.y+dy-13;let sc=ci*.6;
   if(bx<2||bx+w>W-2||by<2||by+h>H-2)sc+=1000;
   pts.forEach(([px,py])=>{if(px>bx-3&&px<bx+w+3&&py>by-3&&py<by+h+3)sc+=6});
   boxes.forEach(b=>{if(bx<b.x+b.w&&bx+w>b.x&&by<b.y+b.h&&by+h>b.y)sc+=300});
   nodes.forEach(o=>{if(o!==nd&&o.x>bx-10&&o.x<bx+w+10&&o.y>by-10&&o.y<by+h+10)sc+=150});
   if(!best||sc<best.sc)best={sc,dx,dy,an,bx,by}});
  boxes.push({x:best.bx,y:best.by,w,h});nd.l=best});
 const selK=tripSeg==="see"?seeCity:null;
 nodes.forEach(nd=>{const c=`var(--${cityColor(nd.k)==="sun"?"pink":cityColor(nd.k)})`,sel=selK===nd.k;
  s+=`<g class="city${sel?" sel":""}" data-city="${esc(nd.k)}" tabindex="0" role="button" aria-label="${esc(pname(nd.k))}: үзэх газрууд"><circle cx="${nd.x.toFixed(1)}" cy="${nd.y.toFixed(1)}" r="18" fill="transparent"/><circle class="dot" cx="${nd.x.toFixed(1)}" cy="${nd.y.toFixed(1)}" r="${sel?8:6.5}" fill="${sel?c:"var(--surface)"}" stroke="${c}" stroke-width="3.5"/></g>`});
 nodes.forEach(nd=>{const l=nd.l;s+=`<text class="cityname${selK===nd.k?" sel":""}" data-city="${esc(nd.k)}" x="${(nd.x+l.dx).toFixed(1)}" y="${(nd.y+l.dy).toFixed(1)}" text-anchor="${l.an}">${esc(pname(nd.k))}</text>`});
 if(hiDay)L.forEach((l,i)=>{if(l.d===hiDay)s+=`<circle r="5" class="plane-dot"><animateMotion dur="2.4s" repeatCount="indefinite" rotate="auto"><mpath href="#leg${i}"/></animateMotion></circle>`});
 s+=`</svg>`;$("#map").innerHTML=s;
 const sw={train:`<line x1="2" y1="4" x2="22" y2="4" stroke="var(--frost)" stroke-width="4" stroke-dasharray="1 6" stroke-linecap="round"/>`,plane:`<line x1="2" y1="4" x2="22" y2="4" stroke="var(--pink)" stroke-width="2.5" stroke-linecap="round"/>`,bus:`<line x1="2" y1="4" x2="22" y2="4" stroke="var(--pink)" stroke-width="2.5" stroke-dasharray="7 5"/>`,boat:`<line x1="2" y1="4" x2="22" y2="4" stroke="var(--pink)" stroke-width="3" stroke-dasharray="2 5" stroke-linecap="round"/>`};
 $("#mapLegend").innerHTML=Object.keys(MODES).filter(m=>L.some(l=>l.m===m)).map(m=>`<span><svg viewBox="0 0 24 8" aria-hidden="true">${sw[m]}</svg>${MODES[m][0]}</span>`).join("")+`<span class="hint">${ico("pin")}Хот дээр дарж үзэх газрыг хар</span>`;
}
function showCity(k){const cs=cityStays();if(!cs.some(c=>c.k===k)){toast(`${pname(k)} бол гэр. Замын хот дээр дарна уу`);return}
 tripSeg="see";seeCity=k;ls.set("sts:tripseg","see");if(view!=="trip")go("trip",false);renderTrip();renderMap();
 const el=$("#planHead");if(el)scrollTo({top:el.getBoundingClientRect().top+scrollY-60,behavior:"smooth"})}
$("#map").addEventListener("click",e=>{const c=e.target.closest("[data-city]");if(c)showCity(c.dataset.city)});
$("#map").addEventListener("keydown",e=>{const c=e.target.closest&&e.target.closest("[data-city]");if(c&&(e.key==="Enter"||e.key===" ")){e.preventDefault();showCity(c.dataset.city)}});

function tzOffset(tz){try{const v=new Intl.DateTimeFormat("en-US",{timeZone:tz,timeZoneName:"shortOffset"}).formatToParts(new Date("2026-12-30T12:00:00Z")).find(x=>x.type==="timeZoneName").value;
 const m=v.match(/GMT([+-]\d+)(?::(\d+))?/);return m?+m[1]+(m[2]?Math.sign(+m[1])*(+m[2])/60:0):0}catch(e){return null}}
async function geoSearch(q){const r=await fetch("https://geocoding-api.open-meteo.com/v1/search?count=8&language=en&format=json&name="+encodeURIComponent(q));
 if(!r.ok)throw new Error("search failed");const j=await r.json();
 return(j.results||[]).filter(x=>isFinite(x.latitude)&&isFinite(x.longitude)).map(x=>({key:"om"+x.id,n:x.name,lat:+x.latitude,lon:+x.longitude,tz:tzOffset(x.timezone),sub:[x.admin1,x.country].filter(Boolean).join(", ")}))}

 const hit=k=>{const p=place(k);return norm(p.n).includes(n)||norm(p.en).includes(n)};const starts=k=>{const p=place(k);return norm(p.n).startsWith(n)||norm(p.en).startsWith(n)};
 return keys.filter(k=>!n||hit(k)).sort((a,b)=>{const x=starts(a),y=starts(b);return x===y?0:x?-1:1}).slice(0,n?30:60)}

   <div><div class="flabel" style="margin-bottom:6px">Төрөл</div><div class="pick" role="group" aria-label="Төрөл">${Object.entries(SK).map(([k,v])=>`<button type="button" class="txt" data-sk="${k}" aria-pressed="${k===st.k}">${ico(v[1])}${v[0]}</button>`).join("")}</div></div>
   <div class="row2"><label class="f">Хот<select id="s-city">${cities.map(k=>`<option value="${esc(k)}" ${k===st.city?"selected":""}>${esc(pname(k))}</option>`).join("")}</select></label>

   <label class="f">Тасалбар, үнэ (заавал биш)<input type="text" id="s-cost" value="${esc(st.cost)}" maxlength="30" placeholder="ж.нь: Үнэгүй, 500 THB"></label>
   <p class="err" id="serr" hidden></p>
  </form>
  <div class="dlg-f">${id?`<button class="btn danger" type="button" data-delsight style="margin-right:auto">${ico("trash")}Хасах</button>`:""}<button class="btn" type="button" data-close>Болих</button><button class="btn sun" type="submit" form="sf">${id?"Хадгалах":"Газар нэмэх"}</button></div>`};
 openDialog(body(),d=>{

  d.addEventListener("click",e=>{const b=e.target.closest("button");if(!b||!d.contains(b))return;
   if(b.dataset.sk){keep();st.k=b.dataset.sk;d.innerHTML=body();return}
   if(b.hasAttribute("data-delsight")){if(b.dataset.armed){S.sights[id]={deleted:true,ts:now()};save();dirty("sights",id);closeDialog();renderTrip();toast("Хасагдлаа")}else{b.dataset.armed="1";b.innerHTML=ico("trash")+"Дахин дарж хасна"}}});
  d.addEventListener("change",e=>{if(e.target.id==="s-city"){keep();st.city=e.target.value;st.day="";d.innerHTML=body()}});
  d.addEventListener("submit",e=>{e.preventDefault();keep();if(!st.n.trim()){const er=$("#serr");er.hidden=false;er.textContent="Нэр өгнө үү.";return}
   const nid=id||"s"+uid();S.sights[nid]={city:st.city,n:st.n.trim(),d:st.d.trim(),k:st.k,day:st.day,cost:st.cost.trim(),created:s?.created||now(),ts:now()};
   save();dirty("sights",nid);closeDialog();if(st.city!==seeCity&&cityStays().some(c=>c.k===st.city))seeCity=st.city;renderTrip();toast(id?"Хадгаллаа":"Нэмэгдлээ")});
  setTimeout(()=>{if(!id)$("#s-n")?.focus()},50);
 });

let taskFilter="all";
function setTask(id,patch){S.tasks[id]={...(S.tasks[id]||{}),...patch,ts:now()};save();dirty("tasks",id)}
$("#v-book").addEventListener("change",e=>{const t=e.target;
 if(t.dataset.tdone){setTask(t.dataset.tdone,{done:t.checked});if(t.checked)toast("Хийгдлээ");renderBook();renderNav();renderTrip();return}
 if(t.dataset.tfRef!==undefined){setTask(t.dataset.tfRef,{ref:t.value.trim()});renderBook()}
 if(t.dataset.tfCost!==undefined){const v=parseFloat(t.value);setTask(t.dataset.tfCost,{cost:v>0?v:null});renderBook()}
 if(t.dataset.tfCur!==undefined){setTask(t.dataset.tfCur,{cur:t.value});renderBook()}

/* ================= BOOKINGS (transport + stays) ================= */
// Every leg of the route and every stay in the plan gets a slot. A booking fills the slot.
const RT={plane:["Нислэг","plane"],train:["Галт тэрэг","train"],bus:["Автобус, машин","bus"],boat:["Завь","boat"],hotel:["Буудал","hotel"]};
const resList=()=>Object.entries(S.res||{}).filter(([,r])=>r&&typeof r==="object"&&!r.deleted&&RT[r.type]).map(([id,r])=>({id,...r}));
const legKey=l=>`${l.d}|${l.a}|${l.b}`;
function legItems(){const rs=resList();return legs().map(l=>({l,key:legKey(l),r:rs.find(r=>r.type!=="hotel"&&r.leg===legKey(l))}))}
function stayItems(){const rs=resList();return cityStays().filter(c=>c.nights.length).map(c=>({c,key:c.k,inD:c.nights[0],outD:addDays(c.nights[c.nights.length-1],1),r:rs.find(r=>r.type==="hotel"&&r.stay===c.k)})).sort((a,b)=>a.inD.localeCompare(b.inD))}
function extraRes(kind){const li=legItems().map(x=>x.r?.id),si=stayItems().map(x=>x.r?.id);
 return resList().filter(r=>kind==="h"?r.type==="hotel"&&!si.includes(r.id):r.type!=="hotel"&&!li.includes(r.id)).sort((a,b)=>(a.depD||a.inD||"").localeCompare(b.depD||b.inD||""))}
function bookingCounts(){const L=legItems(),H=stayItems();return{lt:L.length,lb:L.filter(x=>x.r).length,ht:H.length,hb:H.filter(x=>x.r).length}}
const enName=k=>place(k)?.en||pname(k);
function searchURL(mode,a,b,date,out){
 if(mode==="hotel")return `https://www.booking.com/searchresults.html?ss=${encodeURIComponent(enName(a))}&checkin=${date}&checkout=${out}&group_adults=${S.people.length}&no_rooms=2&group_children=0`;
 if(mode==="plane")return `https://www.google.com/travel/flights?q=${encodeURIComponent(`Flights from ${enName(a)} to ${enName(b)} on ${date}`)}`;
 if(mode==="train"&&(a==="ub"||b==="ub"))return "https://eticket.ubtz.mn/";
 return `https://www.google.com/search?q=${encodeURIComponent(`${mode==="boat"?"ferry":mode==="bus"?"bus":"train"} ${enName(a)} to ${enName(b)} ${date}`)}`}
const safeURL=u=>/^https?:\/\/[^\s"'<>]+$/i.test(u||"")?u:"";
function codeChip(c){return c?`<span class="code">${esc(c)}<button type="button" data-copy="${esc(c)}" aria-label="Кодыг хуулах">${ico("copy")}</button></span>`:""}
function resMeta(r){return `<div class="rmeta">${codeChip(r.code)}${r.price?`<span class="chip">${money(r.price,r.cur||"MNT")}</span>`:""}${r.by&&person(r.by)?`<span class="chip">${av(r.by,"sm")}${esc(person(r.by).name)} захиалсан</span>`:""}</div>${r.note?`<div class="rnote">${esc(r.note)}</div>`:""}`}
function resActions(r,extra=""){const u=safeURL(r.link);return `<div class="ractions">${u?`<a class="btn sm acc" href="${esc(u)}" target="_blank" rel="noopener">${ico("link")}Захиалга нээх</a>`:""}${extra}<button class="btn sm" type="button" data-editres="${esc(r.id)}">${ico("edit")}Засах</button></div>`}
function legCard({l,key,r},extraR){
 const mode=r?.type||l.m,a=extraR?r.from:pname(l.a),b=extraR?r.to:pname(l.b),date=extraR?r.depD:l.d;
 let h=`<article class="card res ${r?"":"todo"}" style="--c:var(--${extraR?"acc":cityColor(l.b)})"><div class="res-h"><span class="ri">${ico(RT[mode]?.[1]||"plane")}</span><div class="rt"><b>${esc(a||"?")} → ${esc(b||"?")}</b><span>${date?dlong(date):""}${r?.carrier?`, ${esc(r.carrier)}`:""}</span></div>${r?`<span class="chip ok">${ico("check")}Захиалсан</span>`:`<span class="chip warn">Захиалаагүй</span>`}</div>`;
 if(r){h+=`<div class="res-b">${r.depT||r.arrT?`<div class="times"><div><b>${esc(r.depT||"--:--")}</b><span>${esc(a)}${r.depD&&r.depD!==date?`, ${dlabel(r.depD)}`:""}</span></div>${ico("arrow")}<div><b>${esc(r.arrT||"--:--")}</b><span>${esc(b)}${r.arrD&&r.arrD!==date?`, ${dlabel(r.arrD)}`:""}</span></div></div>`:""}${resMeta(r)}${resActions(r)}</div>`}
 else h+=`<div class="res-b"><div class="ractions"><button class="btn sm acc" type="button" data-addleg="${esc(key)}">${ico("plus")}Захиалга нэмэх</button><a class="btn sm" href="${esc(searchURL(l.m,l.a,l.b,l.d))}" target="_blank" rel="noopener">${ico("search")}${l.m==="plane"?"Нислэг хайх":l.m==="train"&&(l.a==="ub"||l.b==="ub")?"УБТЗ тасалбар":"Хайх"}</a></div></div>`;
 return h+`</article>`}
function stayCard({c,key,inD,outD,r},extraR){
 const city=extraR?r.city:pname(c.k),i=r?.inD||inD,o=r?.outD||outD,n=i&&o?Math.round((new Date(o)-new Date(i))/864e5):0;
 let h=`<article class="card res ${r?"":"todo"}" style="--c:var(--${extraR?"acc":cityColor(c.k)})"><div class="res-h"><span class="ri">${ico("hotel")}</span><div class="rt"><b>${esc(r?.name||city||"Буудал")}</b><span>${r?.name?esc(city)+", ":""}${i&&o?`${rangeText(i,o)}, ${n} шөнө`:""}</span></div>${r?`<span class="chip ok">${ico("check")}Захиалсан</span>`:`<span class="chip warn">Захиалаагүй</span>`}</div>`;
 if(r){const mapQ=r.addr||[r.name,city].filter(Boolean).join(", ");
  h+=`<div class="res-b"><div class="times"><div><b>${i?dlabel(i):"—"}</b><span>Орох${r.inT?` ${esc(r.inT)}`:""}</span></div>${ico("arrow")}<div><b>${o?dlabel(o):"—"}</b><span>Гарах${r.outT?` ${esc(r.outT)}`:""}</span></div></div>${r.addr?`<div class="muted" style="font-size:13px">${esc(r.addr)}</div>`:""}${resMeta(r)}${resActions(r,`<a class="btn sm" href="${mapsURL(mapQ)}" target="_blank" rel="noopener">${ico("pin")}Газрын зураг</a>`)}</div>`}
 else h+=`<div class="res-b"><div class="ractions"><button class="btn sm acc" type="button" data-addstay="${esc(key)}">${ico("plus")}Захиалга нэмэх</button><a class="btn sm" href="${esc(searchURL("hotel",c.k,null,inD,outD))}" target="_blank" rel="noopener">${ico("search")}Booking.com-оос хайх</a></div></div>`;
 return h+`</article>`}

let bookSeg=(()=>{const v=ls.get("sts:bookseg");return["transport","stay","tasks"].includes(v)?v:"transport"})();
function renderBook(){
 const k=bookingCounts(),done=TASKS.filter(t=>S.tasks[t.id]?.done).length;
 const booked=resList(),spent=booked.reduce((a,r)=>a+(r.price?toMNT(r.price,r.cur||"MNT"):0),0);
 let h=`<div class="view-head"><div><h2>Захиалга</h2><div class="sub">Тээвэр ${k.lb}/${k.lt}, буудал ${k.hb}/${k.ht} захиалсан${spent?`, нийт ${fmt(spent)} ₮`:""}</div></div></div>
 <div class="seg wide" role="group" aria-label="Захиалгын хэсэг">${[["transport","Тээвэр",`${k.lb}/${k.lt}`],["stay","Буудал",`${k.hb}/${k.ht}`],["tasks","Хийх зүйлс",`${done}/${TASKS.length}`]].map(([id,n,c])=>`<button type="button" data-bseg="${id}" aria-pressed="${bookSeg===id}">${n} <span class="muted num" style="font-weight:500">${c}</span></button>`).join("")}</div>`;
 if(bookSeg==="transport"){const L=legItems(),X=extraRes("t");
  h+=L.length?`<div class="reslist">${L.map(x=>legCard(x)).join("")}</div>`:`<div class="card empty">${ico("plane")}Төлөвлөгөөнд аялал алга. Өдөр засахдаа аялал нэмэхэд энд гарна.</div>`;
  if(X.length)h+=`<div class="sgroup-h"><span>Бусад тээвэр</span><span class="muted">${X.length}</span></div><div class="reslist">${X.map(r=>legCard({l:{},key:"",r},true)).join("")}</div>`;
  h+=`<button type="button" class="addday" data-newres="t">${ico("plus")}Өөр тээвэр нэмэх (такси, трансфер, гатлага…)</button>
  <p class="muted" style="margin:0;font-size:12.5px">Маршрутын аялал бүр энд автоматаар гарна. Захиалсныхаа дараа код, холбоос, цагийг нэмбэл өдрийн төлөвлөгөөнд ч харагдана.</p>`}
 if(bookSeg==="stay"){const H=stayItems(),X=extraRes("h");
  h+=H.length?`<div class="reslist">${H.map(x=>stayCard(x)).join("")}</div>`:`<div class="card empty">${ico("hotel")}Төлөвлөгөөнд хонох хот алга.</div>`;
  if(X.length)h+=`<div class="sgroup-h"><span>Бусад буудал</span><span class="muted">${X.length}</span></div><div class="reslist">${X.map(r=>stayCard({c:{},key:"",r},true)).join("")}</div>`;
  h+=`<button type="button" class="addday" data-newres="h">${ico("plus")}Өөр буудал нэмэх</button>
  <p class="muted" style="margin:0;font-size:12.5px">Хонох хот бүр энд автоматаар гарна. Booking.com-ын хайлтад огноо, ${S.people.length} хүн бөглөгдсөн байна.</p>`}
 if(bookSeg==="tasks")h+=tasksHTML();
 $("#v-book").innerHTML=h;
}
function tasksHTML(){
 const done=TASKS.filter(t=>S.tasks[t.id]?.done).length;
 let list=TASKS.filter(t=>{const x=S.tasks[t.id]||{};if(taskFilter==="open")return!x.done;if(taskFilter==="mine")return x.owner===me;if(taskFilter==="pri")return t.p&&!x.done;return true});
 let h=`<div class="toolbar"><span class="muted grow">${TASKS.length}-аас ${done} нь хийгдсэн</span><div class="seg" role="group" aria-label="Шүүх">${[["all","Бүгд"],["pri","Яаралтай"],["open","Үлдсэн"],["mine","Минийх"]].map(([k,n])=>`<button type="button" data-tf="${k}" aria-pressed="${taskFilter===k}">${n}</button>`).join("")}</div></div>`;
 if(taskFilter==="mine"&&!me)return h+`<div class="empty card">${ico("user")}Эхлээд баруун дээд буланд хэн бэ гэдгээ сонгоорой.</div>`;
 if(!list.length)return h+`<div class="empty card">${ico("check")}${taskFilter==="mine"?"Танд оноосон зүйл алга. Аль нэг зүйлийн баруун талын дугуйг дарж өөртөө аваарай.":"Энд юу ч алга. Сайн байна."}</div>`;
 h+=`<div class="card tasks">`;const groups=[...new Set(list.map(t=>t.g))];
 groups.forEach(g=>{const items=list.filter(t=>t.g===g);h+=`<div class="group-h"><span>${ico(GROUPS[g]||"doc")}${esc(g)}</span><span class="muted">${items.filter(t=>S.tasks[t.id]?.done).length}/${items.length}</span></div>`;
  items.forEach(t=>{const x=S.tasks[t.id]||{};
   h+=`<div class="task ${x.done?"done":""}"><input type="checkbox" class="ck" id="t-${t.id}" data-tdone="${t.id}" ${x.done?"checked":""} aria-label="Хийгдсэн">
    <div style="min-width:0"><label for="t-${t.id}" class="ttl">${esc(t.t)}</label>
     <div class="tmeta">${t.p&&!x.done?'<span class="chip warn">Яаралтай</span>':""}<span class="chip">${ico("clock")}${esc(t.due)}</span>${x.ref?`<span class="chip ok">Код ${esc(x.ref)}</span>`:""}${x.cost?`<span class="chip">${money(x.cost,x.cur||"MNT")}</span>`:""}</div>
     <details><summary>${ico("edit")} Дэлгэрэнгүй</summary><div class="tfields">
      <input type="text" placeholder="Код, дугаар" value="${esc(x.ref||"")}" data-tf-ref="${t.id}" aria-label="Код">
      <input type="number" inputmode="decimal" placeholder="Үнэ" value="${x.cost??""}" data-tf-cost="${t.id}" aria-label="Үнэ">
      <select data-tf-cur="${t.id}" aria-label="Валют">${CURS.map(c=>`<option ${c===(x.cur||"MNT")?"selected":""}>${c}</option>`).join("")}</select>
      <input type="text" placeholder="Тэмдэглэл (холбоос, хаяг)" value="${esc(x.note||"")}" data-tf-note="${t.id}" aria-label="Тэмдэглэл" style="grid-column:1/-1"></div></details></div>
    <button type="button" class="owner" data-towner="${t.id}" aria-label="Хэн хариуцах">${av(x.owner)}</button></div>`})});
 return h+`</div><p class="muted" style="margin:0;font-size:12.5px">Баруун талын дугуйг дарж хэн хариуцахыг сонгоно.</p>`}

function balances(){const net={};S.people.forEach(p=>net[p.id]=0);
 liveExp().forEach(x=>{const v=toMNT(x.amount,x.cur);const sp=(x.split||[]).filter(id=>net[id]!==undefined);const who=sp.length?sp:S.people.map(p=>p.id);
  if(net[x.payer]!==undefined)net[x.payer]+=v;who.forEach(id=>net[id]-=v/who.length)});return net}
function shares(){const s={};S.people.forEach(p=>s[p.id]=0);liveExp().forEach(x=>{const v=toMNT(x.amount,x.cur);const sp=(x.split||[]).filter(id=>s[id]!==undefined);const who=sp.length?sp:S.people.map(p=>p.id);who.forEach(id=>s[id]+=v/who.length)});return s}
function settle(net){const cr=[],de=[];Object.entries(net).forEach(([id,v])=>{if(v>0.5)cr.push([id,v]);else if(v<-0.5)de.push([id,-v])});
 cr.sort((a,b)=>b[1]-a[1]);de.sort((a,b)=>b[1]-a[1]);const out=[];let i=0,j=0;
 while(i<de.length&&j<cr.length){const m=Math.min(de[i][1],cr[j][1]);out.push({from:de[i][0],to:cr[j][0],amt:m});de[i][1]-=m;cr[j][1]-=m;if(de[i][1]<0.5)i++;if(cr[j][1]<0.5)j++}return out}

function encodeState(){const j=JSON.stringify(S);if(window.LZString)return"z"+LZString.compressToEncodedURIComponent(j);return"b"+btoa(unescape(encodeURIComponent(j))).replace(/\+/g,"-").replace(/\//g,"_").replace(/=+$/,"")}
function decodeState(s){try{if(s[0]==="z"){if(!window.LZString)return null;return JSON.parse(LZString.decompressFromEncodedURIComponent(s.slice(1)))}
 if(s[0]==="b"){let b=s.slice(1).replace(/-/g,"+").replace(/_/g,"/");while(b.length%4)b+="=";return JSON.parse(decodeURIComponent(escape(atob(b))))}}catch(e){}return null}
function shareURL(){return location.origin+location.pathname+"#s="+encodeState()}
const newer=(a,b)=>!a?b:!b?a:((b.ts||0)>(a.ts||0)?b:a);
function mergeState(A,B){
 if(!B||B.v!==1)throw new Error("bad");const out=JSON.parse(JSON.stringify(A));
 out.people=A.people.map(p=>newer(p,(B.people||[]).find(q=>q.id===p.id)));
 out.rates=newer(A.rates,B.rates);
 ["tasks","expenses","actuals","pack","extraPack","days","places","sights","votes","res"].forEach(k=>{const a=A[k]||{},b=B[k]||{};out[k]={};new Set([...Object.keys(a),...Object.keys(b)]).forEach(id=>out[k][id]=newer(a[id],b[id]))});
 return out}
function diffCount(A,B){let n=0;["tasks","expenses","actuals","pack","extraPack","days","places","sights","votes","res"].forEach(k=>{const a=A[k]||{},b=B[k]||{};Object.keys(b).forEach(id=>{if(!a[id]||(b[id].ts||0)>(a[id].ts||0))n++})});
 (B.people||[]).forEach(q=>{const p=A.people.find(x=>x.id===q.id);if(p&&(q.ts||0)>(p.ts||0))n++});if((B.rates?.ts||0)>(A.rates?.ts||0))n++;return n}
function applyIncoming(B,src){const n=diffCount(S,B);if(!n){toast("Аль хэдийн шинэчлэгдсэн байна");return}S=mergeState(S,B);save();if(SYNC.code)markAll();renderAllData();toast(`${n} өөрчлөлт нэгтгэлээ`)}

async function pullRaw(){
